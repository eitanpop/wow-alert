class: monk
spec: mistweaver

# Mistweaver Monk action library for Midnight (Patch 12.0.5).
#
# This file lists abilities that a rule engine might bind for a callout.
# Pure healing-rotation spells (Vivify, Renewing Mist, Enveloping Mist,
# Soothing Mist, Sheilun's Gift, Rising Sun Kick, Thunder Focus Tea,
# Mana Tea) are not listed because rules don't bind them — they're
# managed by the player's normal rotation, not by reactive callouts.
#
# Notes on talent / build assumptions:
# - Detox is listed as magic-only baseline. The Improved Detox talent
#   adds poison and disease — if the player has that talented, change
#   the tags below to [magic, poison, disease].
# - Invoke Yu'lon and Invoke Chi-Ji are a choice node — only one can be
#   talented. Yu'lon is listed as the default (raid pick); swap to
#   Chi-Ji for Mythic+ / Fistweaver builds (see commented entry).
# - Ring of Peace and Song of Chi-Ji are a choice node — only one can
#   be talented. Ring of Peace is listed as the default.
# - Revival and Restoral are a choice node — Revival is the default
#   (heal + party magic dispel); Restoral is heal-only.
# - Mistweaver has NO interrupt in Midnight (Spear Hand Strike was
#   removed). Rules using `category: interrupt` will never bind for
#   this spec.
# - Diffuse Magic is no longer a standalone defensive in Midnight; it
#   was reworked into a passive effect on Fortifying Brew that dispels
#   a magic effect from the monk, so it isn't listed as an action.

actions:
  # ---- Single-target external defensive ----
  - id: life_cocoon
    label: "Cocoon"
    category: defensive
    scope: single_target
    spell_id: 116849

  # ---- Single-target utility ----
  # Tiger's Lust clears snares/roots and adds speed — NOT damage
  # mitigation, so it lives under `utility` (not `defensive`) to keep
  # tank-buster/defensive rules from binding it. The snare_break tag
  # drives the (deferred) snare-break callouts.
  - id: tigers_lust
    label: "Tiger's Lust"
    category: utility
    scope: single_target
    tags: [snare_break]
    spell_id: 116841

  # ---- Party-wide healing cooldowns, in PREFERENCE ORDER ----
  # The engine binds the first matching action in file order, so a
  # "heal, party_wide" rule picks Celestial Conduit → Yu'lon → Revival.
  # Celestial Conduit (Conduit of the Celestials hero talent) and Yu'lon
  # are sustained throughput CDs; Revival is a precious instant burst we
  # save for emergencies, so it sits last among the heals.

  - id: celestial_conduit
    label: "Celestial Conduit"
    category: heal
    scope: party_wide
    spell_id: 443028

  # Yu'lon and Chi-Ji are healing cooldowns, NOT damage reduction.
  # Categorized as `heal` rather than `defensive` so rules asking for
  # damage reduction don't mistakenly bind them.
  - id: invoke_yulon
    label: "Yu'lon"
    category: heal
    scope: party_wide
    spell_id: 322118

  # ---- Dispels ----
  # Detox: single-target, magic only at baseline (Improved Detox adds
  # poison + disease — add those tags if talented). Listed before Revival
  # so single-target dispel rules prefer it over the raid cooldown.
  - id: detox
    label: "Detox"
    category: dispel
    scope: single_target
    tags: [magic]
    spell_id: 218164

  # Revival is DUAL-PURPOSE: a party-wide heal (lowest priority — it
  # follows the heal CDs above) AND a mass dispel of Magic, Poison, and
  # Disease. `category: [heal, dispel]` lets both heal/party_wide and
  # dispel/party_wide rules bind it; the magic/poison/disease tags let a
  # type-specific dispel rule pick it. emergency_only flags it as a
  # save-it-for-trouble cooldown.
  - id: revival
    label: "Revival"
    category: [heal, dispel]
    scope: party_wide
    tags: [magic, poison, disease, emergency_only]
    spell_id: 115310

  # ---- Self defensives ----
  - id: fortifying_brew
    label: "Fort Brew"
    category: defensive
    scope: self
    spell_id: 115203

  - id: dampen_harm
    label: "Dampen Harm"
    category: defensive
    scope: self
    spell_id: 122278

  # ---- Crowd control ----
  - id: paralysis
    label: "Paralysis"
    category: cc
    scope: single_target
    spell_id: 115078

  - id: leg_sweep
    label: "Leg Sweep"
    category: cc
    scope: party_wide
    tags: [melee_range]
    spell_id: 119381

  # ---- Stops (knockback) ----
  - id: ring_of_peace
    label: "Ring of Peace"
    category: stop
    scope: party_wide
    spell_id: 116844

  # ---- Choice-node alternates (uncomment whichever side the build uses) ----
  #
  # Chi-Ji replaces Yu'lon on the celestial choice node — more common in
  # Mythic+ / Fistweaver builds.
  # - id: invoke_chi_ji
  #   label: "Chi-Ji"
  #   category: heal
  #   scope: party_wide
  #   spell_id: 325197
  #
  # Restoral replaces Revival — same heal, no magic dispel. Pick this
  # variant on fights where accidental magic dispels would be bad.
  # - id: restoral
  #   label: "Restoral"
  #   category: heal
  #   scope: party_wide
  #   tags: [emergency_only]
  #   spell_id: 388615
  #
  # Song of Chi-Ji replaces Ring of Peace — AoE disorient cone.
  # - id: song_of_chi_ji
  #   label: "Song of Chi-Ji"
  #   category: cc
  #   scope: party_wide
  #   spell_id: 198898