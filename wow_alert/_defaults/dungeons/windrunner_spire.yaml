# Windrunner Spire spell database. Loaded automatically when calibration
# identifies this dungeon (slug: windrunner_spire). Add globally-applicable
# entries to config/dungeons/_global.yaml instead.
#
# Spell schema (authoritative: wow_alert/events.py:Spell):
#   id:           stable identifier (any string)
#   name:         canonical display name; primary fuzzy-match target
#   aliases:      known OCR misreads of `name`
#   severity:     danger | info | ignore
#   phrase:       AlertPlayer phrase to play on a danger match
#   duration:     optional; trusted over OCR if present
#   cast_by:      [boss | mob | ...]
#   school:       spell school
#   interruptible: bool
#   tags:         mechanic tags driving the recommendation (see config/tag_rules.yaml)
#   notes:        free-text

