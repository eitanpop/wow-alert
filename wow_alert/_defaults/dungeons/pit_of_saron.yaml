# Pit of Saron spell database. Loaded when calibration identifies this
# dungeon (slug: pit_of_saron).
#
# Authored from the method.gg ability tracker (Midnight 12.0.5):
#   https://www.method.gg/guides/dungeons/pit-of-saron/ability-tracker
#
# Spell schema (authoritative: wow_alert/events.py:Spell):
#   id / name / aliases / severity / phrase / duration / cast_by /
#   school / interruptible / tags / notes
#
# Dispel note: the tracker tags effects "blessing-of-freedom" (snare/root
# that Freedom or Tiger's Lust clears) and "stoneform/shadowmeld" (racial
# self-cleanses). None are healer dispels, so no dispel/snare rules are
# authored. Mob self-buffs (Deathless Bond, Necromantic Infusion,
# Necrolink, Plague Frenzy) are info heads-ups — set them to `ignore` if
# the audio is noisy. Omitted: no-detail casts (Charging Slash, Frost
# Spit). "Rotting Strikes" is cast by a trash mob and by the boss; one
# entry, since the cast bar can't tell them apart.

dungeon: "Pit of Saron"

