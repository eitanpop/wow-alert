# Algeth'ar Academy spell database. Loaded when calibration identifies
# this dungeon (slug: algeth_ar_academy — the apostrophe in the display
# name becomes an underscore).
#
# Authored from the method.gg ability tracker (12.0.5):
#   https://www.method.gg/guides/dungeons/algethar-academy/ability-tracker
#
# Spell schema (authoritative: wow_alert/events.py:Spell):
#   id / name / aliases / severity / phrase / duration / cast_by /
#   school / interruptible / tags / notes
#
# Dispel note: several debuffs here are tagged "via Stoneform/Shadowmeld"
# on the tracker — those are racial *self*-cleanses, not healer dispels,
# so no dispel rules are authored for them. Pure-filler casts with no
# tracker detail (Darting Sting, Vicious Lunge, Abundance, Arcane
# Missiles) are intentionally omitted to avoid noise.

