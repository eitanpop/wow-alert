# Spell database. Edit by hand, or regenerate with
# `poetry run python -m wow_alert.tools.import_spells` when that script exists.
# The runtime never writes to this file.
#
# Schema (authoritative definition is wow_alert/events.py:Spell):
#   id:           stable identifier (any string)
#   name:         canonical display name; primary fuzzy-match target
#   aliases:      known OCR misreads of `name`
#   dungeon:      null = applies globally; otherwise the dungeon name
#   severity:     danger | info | ignore
#   phrase:       AlertPlayer phrase to play on a danger match
#
# Optional metadata used by rule engines that have player class / roster context;
# safe to omit for simple alerts:
#   cast_by:      which kind of unit casts this (e.g. boss, mob)
#   school:       spell school
#   interruptible:bool
#   counters:     list of {class, spec, action}; specific class responses
#   notes:        free-text reminder for human readers

