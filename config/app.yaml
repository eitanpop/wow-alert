# wow-alert runtime config. CLI flags and env vars override these.
window_title: World of Warcraft
model_path: D:/wow_rl_addon/models/model2/runs/detect/train-2/weights/best.pt
confidence: 0.4
imgsz: 1280
display_width: 1280
window_refresh_interval: 1.0
target_fps: 10
lost_track_tolerance_s: 0.5
alert_dedupe_default_ttl_s: 5.0
alert_dedupe_max_ttl_s: 10.0
alert_dedupe_unmatched_max_ttl_s: 10.0
ocr_thread_cap: 2
show_preview: true

# Spells + rules are loaded from config/dungeons/ (see _global.yaml plus
# per-dungeon files). No path config here — the layout is fixed.
#
# tts_cache_dir is intentionally omitted — defaults to the OS user-data
# directory (see wow_alert/paths.py). Override here only if you need a
# project-local cache, e.g. for testing.

fuzzy_threshold: 85

# Optional scoping. When set, only spells matching the dungeon and only counters
# matching the (class, spec) pair are loaded. Leave null to load everything.
dungeon: null
player_class: null
player_spec: null
