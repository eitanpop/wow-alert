class: paladin
spec: holy

# Holy Paladin action library for Midnight (Patch 12.0.5).
#
# This file lists abilities that a rule engine might bind for a callout.
# Pure healing-rotation spells (Holy Shock, Word of Glory, Light of Dawn,
# Flash of Light, Holy Light, Eternal Flame, Beacon of Light) are not
# listed because rules don't bind them — they're managed by the player's
# normal rotation, not by reactive callouts.
#
# Notes on talent / build assumptions:
# - Cleanse is listed as magic-only baseline. The Improved Cleanse talent
#   adds poison and disease — if the player has that talented, change
#   the tags below to [magic, poison, disease].
# - Holy Paladin has no baseline interrupt in Midnight. Rebuke exists
#   only as a Lightsmith hero-talent pickup; commented at the bottom.
# - Blessing of Spellwarding is talented (not all builds run it).

actions:
  # ---- Single-target external defensives ----
  # Sac is listed before BoP so generic "any single-target defensive"
  # rules bind Sac first. Tank-buster rules using `lacks_tag:
  # aggro_dropping` will skip BoP and Spellwarding automatically.
  - id: blessing_of_sacrifice
    label: "Sac"
    category: defensive
    scope: single_target
    spell_id: 6940

  - id: blessing_of_protection
    label: "BOP"
    category: defensive
    scope: single_target
    tags: [aggro_dropping, physical_immunity]
    spell_id: 1022

  - id: blessing_of_spellwarding
    label: "Spellwarding"
    category: defensive
    scope: single_target
    tags: [aggro_dropping, magic_immunity]
    spell_id: 204018

  # ---- Single-target utility ----
  - id: blessing_of_freedom
    label: "Freedom"
    category: defensive
    scope: single_target
    tags: [snare_break]
    spell_id: 1044

  # ---- Party/raid-wide defensives ----
  - id: devotion_aura
    label: "Devotion Aura"
    category: defensive
    scope: party_wide
    spell_id: 465

  - id: aura_mastery
    label: "Aura Mastery"
    category: defensive
    scope: party_wide
    spell_id: 31821

  # ---- Self defensives ----
  - id: divine_shield
    label: "Bubble"
    category: defensive
    scope: self
    tags: [full_immunity]
    spell_id: 642

  - id: divine_protection
    label: "Divine Protection"
    category: defensive
    scope: self
    spell_id: 498

  # ---- Lightsmith hero-talent defensive (single-target absorb) ----
  - id: holy_bulwark
    label: "Holy Bulwark"
    category: defensive
    scope: single_target
    spell_id: 432459

  # ---- Healing throughput cooldown ----
  # Avenging Wrath buffs Holy's healing output for the duration. Lives
  # under `heal` rather than `defensive` because it doesn't reduce
  # incoming damage — it lets the healer outheal it.
  - id: avenging_wrath
    label: "Avenging Wrath"
    category: heal
    scope: self
    spell_id: 31884

  # ---- Heals ----
  - id: lay_on_hands
    label: "Lay on Hands"
    category: heal
    scope: single_target
    tags: [emergency_only]
    spell_id: 633

  # ---- Dispels ----
  # Baseline Cleanse removes magic only. With Improved Cleanse talented,
  # add poison and disease to the tags below.
  - id: cleanse
    label: "Cleanse"
    category: dispel
    scope: single_target
    tags: [magic]
    spell_id: 4987

  # ---- Crowd control ----
  - id: hammer_of_justice
    label: "Hammer"
    category: cc
    scope: single_target
    spell_id: 853

  - id: blinding_light
    label: "Blinding Light"
    category: cc
    scope: party_wide
    spell_id: 115750

  # ---- Lightsmith hero-talent pickup (optional) ----
  # Rebuke exists only when running Lightsmith and talenting into it.
  # Uncomment if that's the player's build.
  # - id: rebuke
  #   label: "Rebuke"
  #   category: interrupt
  #   scope: single_target
  #   tags: [melee_range]
  #   spell_id: 96231