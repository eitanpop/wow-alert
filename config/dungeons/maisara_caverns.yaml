# ============================== RULES ==============================
# Class-agnostic: each priority binds whatever the calibrated class
# library offers; if nothing matches, the engine falls through to the
# spell's default phrase.
#
# Patterns:
#   interrupt      category: interrupt → kick the caster
#   stop           category: stop → cc (knockback/stun the channel)
#   tank-external  single_target defensive, lacks_tag aggro_dropping
#                  (Sac / Cocoon, not BoP — BoP drops threat)
#   party-wide     party_wide defensive → party_wide heal → spell default
rules:
  # ---------------- Interrupts ----------------
  - on_cast: { spell_id: maisara_hooked_snare }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: maisara_shadow_bolt }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: maisara_hex }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: maisara_shrink }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: maisara_reanimation }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: maisara_spirit_rend }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: maisara_shadowfrost_blast }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: maisara_piercing_screech }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  # Interruptible boss casts that also pulse the group — kick first,
  # otherwise soften with a raid defensive / heal.
  - on_cast: { spell_id: maisara_necrotic_convergence }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"
      - category: defensive
        scope: party_wide
        say: "{action.label}"
        do: "{action.id}"
      - category: heal
        scope: party_wide
        say: "{action.label}"
        do: "{action.id}"

  - on_cast: { spell_id: maisara_eternal_suffering }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"
      - category: defensive
        scope: party_wide
        say: "{action.label}"
        do: "{action.id}"
      - category: heal
        scope: party_wide
        say: "{action.label}"
        do: "{action.id}"

  # ---------------- Stop (CC the channel, not a kick) ----------------
  - on_cast: { spell_id: maisara_shredding_talons }
    priorities:
      - category: stop
        say: "{action.label} the channel"
        do: "{action.id}"
      - category: cc
        say: "{action.label} the caster"
        do: "{action.id}"

  # ---------------- Tank busters (boss) ----------------
  # Trash tank hits (Rending Gore, Crunch Armor, Staggering Blow, Dread
  # Slash) are left as plain alerts — externals are saved for boss hits.
  - on_cast: { spell_id: maisara_flanking_spear }
    priorities:
      - category: defensive
        scope: single_target
        lacks_tag: aggro_dropping
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: maisara_drain_soul }
    priorities:
      - category: defensive
        scope: single_target
        lacks_tag: aggro_dropping
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: maisara_spiritbreaker }
