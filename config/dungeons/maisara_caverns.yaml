# Maisara Caverns spell database. Loaded when calibration identifies
# this dungeon (slug: maisara_caverns).
#
# Authored from the method.gg ability tracker (Midnight 12.0.5):
#   https://www.method.gg/guides/dungeons/maisara-caverns/ability-tracker
#
# Spell schema (authoritative: wow_alert/events.py:Spell):
#   id / name / aliases / severity / phrase / duration / cast_by /
#   school / interruptible / notes
#
# Dispel note: the tracker tags effects "via Freedom" (snare/root that
# Blessing of Freedom or Tiger's Lust clears), "via Stoneform/Shadowmeld"
# (racial self-cleanses), and several "dispellable" enrages (Soothe —
# which Holy Paladin and Mistweaver lack). None are healer dispels, so no
# dispel/snare rules are authored here. Omitted: mob self-heal buffs
# (Regeneratin') and no-detail casts (Throw Spear, Sear) — no player
# response. "Spectral Strikes" is cast by two trash mobs; one entry.

