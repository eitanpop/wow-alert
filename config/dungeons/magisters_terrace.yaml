# ============================== RULES ==============================
# Class-agnostic: each priority binds whatever the calibrated class
# library offers; if nothing matches, the engine falls through to the
# spell's default phrase.
#
# Patterns:
#   interrupt      category: interrupt → kick the caster
#   tank-external  single_target defensive, lacks_tag aggro_dropping
#                  (Sac / Cocoon, not BoP — BoP drops threat)
#   party-wide     party_wide defensive → party_wide heal → spell default
rules:
  # ---------------- Interrupts ----------------
  - on_cast: { spell_id: mt_arcane_bolt }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: mt_polymorph }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: mt_pyroblast }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: mt_shadow_bolt }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: mt_terror_wave }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  # ---------------- Tank busters (boss) ----------------
  # Mob-cast tank hits (Devouring Strike, Void Gash, the Arcane Sentry
  # Ethereal Shackles) are left as plain alerts — externals are saved
  # for boss hits.
  - on_cast: { spell_id: mt_repulsing_slam }
    priorities:
      - category: defensive
        scope: single_target
        lacks_tag: aggro_dropping
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: mt_hastening_ward }
    priorities:
      - category: defensive
        scope: single_target
        lacks_tag: aggro_dropping
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: mt_entropy_blast }
    priorities:
      - category: defensive
        scope: single_target
        lacks_tag: aggro_dropping
        say: "{action.label} {target}"
