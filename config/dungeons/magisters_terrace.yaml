# Magisters' Terrace spell database. Loaded when calibration identifies
# this dungeon (slug: magisters_terrace).
#
# Authored from the method.gg ability tracker (Midnight 12.0.5):
#   https://www.method.gg/guides/dungeons/magisters-terrace/ability-tracker
#
# Spell schema (authoritative: wow_alert/events.py:Spell):
#   id / name / aliases / severity / phrase / duration / cast_by /
#   school / interruptible / notes
#
# Dispel note: the tracker tags several effects "via Freedom" (a snare/
# root Blessing of Freedom or Tiger's Lust clears) and "via Stoneform/
# Shadowmeld" (racial self-cleanses). None are healer dispels, so no
# dispel/snare rules are authored here. Pure-filler casts with no tracker
# detail (Dimensional Shred) are omitted to avoid noise. "Ethereal
# Shackles" is cast by both a trash mob and a boss; since the cast bar
# can't distinguish caster, it's a single entry.

