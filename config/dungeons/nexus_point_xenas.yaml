# ============================== RULES ==============================
# Class-agnostic: each priority binds whatever the calibrated class
# library offers; if nothing matches, the engine falls through to the
# spell's default phrase.
#
# Patterns:
#   interrupt      category: interrupt → kick the caster
#   stop           category: stop → cc (knockback/stun the channel)
#   tank-external  single_target defensive, lacks_tag aggro_dropping
#                  (Sac / Cocoon, not BoP — BoP drops threat)
#   party-wide     party_wide defensive → party_wide heal → spell default
rules:
  # ---------------- Interrupts ----------------
  - on_cast: { spell_id: nexus_arcane_explosion }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: nexus_umbra_bolt }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: nexus_nullify }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: nexus_holy_bolt }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  # Interruptible boss cast that also pulses the group — kick first,
  # otherwise soften with a raid defensive / heal.
  - on_cast: { spell_id: nexus_divine_guile }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"
      - category: defensive
        scope: party_wide
        say: "{action.label}"
        do: "{action.id}"
      - category: heal
        scope: party_wide
        say: "{action.label}"
        do: "{action.id}"

  # ---------------- Stop (CC the channel, not a kick) ----------------
  - on_cast: { spell_id: nexus_leech_veil }
    priorities:
      - category: stop
        say: "{action.label} the channel"
        do: "{action.id}"
      - category: cc
        say: "{action.label} the caster"
        do: "{action.id}"

  # ---------------- Tank busters (boss) ----------------
  # Trash tank hits (Null Sunder, Nullwark Blast, Void Lash) are left as
  # plain alerts — externals are saved for boss hits.
  - on_cast: { spell_id: nexus_arcane_zap }
    priorities:
      - category: defensive
        scope: single_target
        lacks_tag: aggro_dropping
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: nexus_umbral_lash }
    priorities:
      - category: defensive
        scope: single_target
        lacks_tag: aggro_dropping
        say: "{action.label} {target}"
        do: "{action.id}"

