# Nexus Point Xenas spell database. Loaded when calibration identifies
# this dungeon (slug: nexus_point_xenas).
#
# Authored from the method.gg ability tracker (Midnight 12.0.5):
#   https://www.method.gg/guides/dungeons/nexus-point-xenas/ability-tracker
#
# Spell schema (authoritative: wow_alert/events.py:Spell):
#   id / name / aliases / severity / phrase / duration / cast_by /
#   school / interruptible / notes
#
# Dispel note: the tracker tags effects "via Freedom" (snare/root that
# Blessing of Freedom or Tiger's Lust clears), "via Stoneform/Shadowmeld"
# (racial self-cleanses), and several "Magic (buff)" mob self-buffs
# (offensive purges — which Holy Paladin and Mistweaver lack). None are
# healer dispels, so no dispel/snare rules are authored. Omitted: no-detail
# casts (Nascent Energy, Dimensional Shred) and purgeable self-buffs with
# no player response (Circuit Sense, Cluster Weakness). Casts shared by
# multiple units (Arcane Zap, Searing Rend, Flux Collapse) are one entry
# each — the cast bar can't tell the casters apart.

