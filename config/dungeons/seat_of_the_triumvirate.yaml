# ============================== RULES ==============================
# Class-agnostic: each priority binds whatever the calibrated class
# library offers; if nothing matches, the engine falls through to the
# spell's default phrase.
#
# Patterns:
#   interrupt      category: interrupt → kick the caster
#   tank-external  single_target defensive, lacks_tag aggro_dropping
#                  (Sac / Cocoon, not BoP — BoP drops threat)
#   party-wide     party_wide defensive → party_wide heal → spell default
rules:
  # ---------------- Interrupts ----------------
  - on_cast: { spell_id: sott_umbral_bolt }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: sott_summon_voidcaller }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: sott_shadowmend }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: sott_mind_blast }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"

  # Interruptible casts that also pulse the group — kick first, otherwise
  # soften with a raid defensive / heal.
  - on_cast: { spell_id: sott_dread_screech }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"
      - category: defensive
        scope: party_wide
        say: "{action.label}"
        do: "{action.id}"
      - category: heal
        scope: party_wide
        say: "{action.label}"
        do: "{action.id}"

  - on_cast: { spell_id: sott_abyssal_enhancement }
    priorities:
      - category: interrupt
        say: "{action.label} {target}"
        do: "{action.id}"
      - category: defensive
        scope: party_wide
        say: "{action.label}"
        do: "{action.id}"
      - category: heal
        scope: party_wide
        say: "{action.label}"
        do: "{action.id}"

  # ---------------- Tank busters (boss) ----------------
  # Trash tank hits (Relentless Pursuit, Void Bash) are left as plain
  # alerts — externals are saved for boss hits.
  - on_cast: { spell_id: sott_void_slash }
    priorities:
      - category: defensive
        scope: single_target
        lacks_tag: aggro_dropping
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: sott_rending_void }
    priorities:
      - category: defensive
        scope: single_target
        lacks_tag: aggro_dropping
        say: "{action.label} {target}"
        do: "{action.id}"

  - on_cast: { spell_id: sott_abyssal_lance }
    priorities:
      - category: defensive
        scope: single_target
        lacks_tag: aggro_dropping
        say: "{action.label} {target}"
        do: "{action.id}"

  # ---------------- Party-wide damage ----------------
