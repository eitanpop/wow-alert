# Seat of the Triumvirate spell database. Loaded when calibration
# identifies this dungeon (slug: seat_of_the_triumvirate).
#
# Authored from the method.gg ability tracker (Midnight 12.0.5):
#   https://www.method.gg/guides/dungeons/seat-of-the-triumvirate/ability-tracker
#
# Spell schema (authoritative: wow_alert/events.py:Spell):
#   id / name / aliases / severity / phrase / duration / cast_by /
#   school / interruptible / notes
#
# Dispel note: the tracker tags effects "blessing-of-freedom" (snare/root
# that Freedom or Tiger's Lust clears) and "stoneform/shadowmeld" (racial
# self-cleanses). None are healer dispels, so no dispel/snare rules are
# authored. Mob self-buffs (Battle Rage, Devouring Frenzy, Siphon Void)
# are info heads-ups — set to `ignore` if noisy. "Rupture" is one cast
# (the tracker lists its tags split across two rows); "Gates of the
# Abyss" merges the singular Grand Shadow-Weaver and plural Viceroy
# Nezhar variants since the cast bar can't tell them apart.

